
<h2 mat-dialog-title>
  {{ data.title }}
</h2>

<mat-dialog-content>
  <div class="confirmation-message">
    <mat-icon class="warning-icon">warning</mat-icon>
    <p>{{ data.message }}</p>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button
    mat-button
    type="button"
    (click)="cancel()">
    Cancel
  </button>

  <button
    mat-flat-button
    class="confirm-button"
    type="button"
    (click)="confirm()">
    {{ data.confirmButtonText }}
  </button>
</mat-dialog-actions>
